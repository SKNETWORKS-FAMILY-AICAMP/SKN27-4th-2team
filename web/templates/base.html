{% load static %}
<!doctype html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Pet Mate{% endblock %}</title>
    <link rel="preconnect" href="https://images.unsplash.com">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body class="{% block body_class %}{% endblock %}">
    <div class="app-shell">
        <header class="topbar">
            <a class="brand" href="{% url 'home' %}" aria-label="Pet Mate 홈">
                <span class="brand-mark">PM</span>
                <span class="brand-name">Pet Mate</span>
            </a>

            <nav class="primary-nav" aria-label="주요 메뉴">
                <a href="{% url 'home' %}">홈</a>
                <a href="{% url 'chatbot:chat' %}">챗봇</a>
                <a href="{% url 'dog:search' %}">견종도감</a>
                <a href="{% url 'guide:guide' %}">가이드</a>
                <a href="/test/">입양 테스트</a>
                <a href="{% url 'shelter:list' %}">유기견 입양</a>
            </nav>

            <div class="auth-nav">
                {% if user.is_authenticated %}
                    <a class="user-chip" href="{% url 'user:profile' %}">{{ user.get_username }}</a>
                    <form method="post" action="{% url 'user:logout' %}">
                        {% csrf_token %}
                        <button class="ghost-button" type="submit">로그아웃</button>
                    </form>
                {% else %}
                    <a class="ghost-button" href="{% url 'user:login' %}">로그인</a>
                    <a class="solid-nav-button" href="{% url 'user:signup' %}">회원가입</a>
                {% endif %}
            </div>
        </header>

        {% block content %}{% endblock %}
    </div>
</body>
</html>
